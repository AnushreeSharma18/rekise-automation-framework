<!DOCTYPE html>
<html>
<head>
    <title>Rekise Marine Dashboard Mock</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .vessel-container {
            display: flex;
            gap: 20px;
        }

        .vessel-card {
            border: 2px solid #ccc;
            padding: 15px;
            width: 200px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .status-online {
            color: green;
            font-weight: bold;
        }

        .status-offline {
            color: red;
            font-weight: bold;
        }

        button {
            padding: 8px 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Modal window */
        #modal {
            display:none;
            position: fixed;
            top: 20%;
            left: 35%;
            width: 350px;
            background: white;
            border: 2px solid black;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #444;
        }

        #modal h3 {
            margin-top: 0;
        }

        .subsystem {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <h1>Rekise Marine – Vessel Dashboard</h1>

    <div class="vessel-container">
        <!-- Vessel A (Online) -->
        <div class="vessel-card" data-name="Vessel A" data-mission="Mission Alpha">
            <h3>Vessel A</h3>
            <p>Status: <span class="status-online">ONLINE</span></p>
            <button class="details-btn">Details</button>
        </div>

        <!-- Vessel B (Online) -->
        <div class="vessel-card" data-name="Vessel B" data-mission="Mission Bravo">
            <h3>Vessel B</h3>
            <p>Status: <span class="status-online">ONLINE</span></p>
            <button class="details-btn">Details</button>
        </div>

        <!-- Vessel C (Offline) -->
        <div class="vessel-card" data-name="Vessel C" data-mission="Mission Charlie">
            <h3>Vessel C</h3>
            <p>Status: <span class="status-offline">OFFLINE</span></p>
            <button class="details-btn">Details</button>
        </div>
    </div>

    <!-- Modal Definition -->
    <div id="modal">
        <h3 id="modalTitle"></h3>
        <p><strong>Mission:</strong> <span id="missionName"></span></p>

        <h4>Subsystems</h4>
        <div class="subsystem">
            Propulsion: <span id="propulsionStatus">Operational</span>
        </div>
        <div class="subsystem">
            Battery: <span id="batteryStatus">Normal</span>
        </div>

        <button id="returnBtn">Return to Base</button>
        <button onclick="closeModal()">Close</button>
    </div>

    <script>
        const modal = document.getElementById("modal");
        const modalTitle = document.getElementById("modalTitle");
        const missionName = document.getElementById("missionName");

        const cards = document.querySelectorAll(".details-btn");

        // DETAILS button → Open modal
        cards.forEach(btn => {
            btn.onclick = () => {
                const parent = btn.closest(".vessel-card");

                modalTitle.innerText = parent.dataset.name;
                missionName.innerText = parent.dataset.mission;

                modal.style.display = "block";
            };
        });

        function closeModal() {
            modal.style.display = "none";
        }

        // Return to Base → Fake API call
        document.getElementById("returnBtn").onclick = () => {
            console.log("API Simulation: /return-to-base"); // Used in Test 3
            alert("Return-to-Base API Triggered!");
        };
    </script>

</body>
</html>
